<script>
const config=window.QUIZ_CONFIG||{};

const PREVIEW_REVIEW=[
 {answer:'human',explanation:'A sourced photograph from Unsplash. Natural detail can look surprisingly unreal.',source:'https://images.unsplash.com/photo-1472396961693-142e6e269027'},
 {answer:'ai',explanation:'Generated for this quiz with OpenAI image generation. The photographic style is part of the illusion.',source:'https://openai.com/index/introducing-4o-image-generation/'},
 {answer:'human',explanation:'A sourced portrait photograph from Unsplash. Smooth lighting is not evidence of AI on its own.',source:'https://images.unsplash.com/photo-1517841905240-472988babdf9'},
 {answer:'human',explanation:'A human narration of A Scandal in Bohemia by Arthur Conan Doyle, from LibriVox. The excerpt is trimmed from the recording.',source:'https://archive.org/details/adventures_sherlock_holmes_rg_librivox'},
 {answer:'ai',explanation:'Written by ChatGPT for this quiz. Evocative imagery and natural language can be generated, too.',source:'https://openai.com/chatgpt/overview/'}
];
const questions=[
{type:'Image',title:'A moment in the wild.',name:'The woodland scene',src:'./media/forest.jpg',alt:'Two deer standing among green woodland plants'},
{type:'Image',title:'A little afternoon escape.',name:'The corner café',src:'./media/cafe.jpg',alt:'A quiet street café with pale buildings, a striped awning and plants'},
{type:'Image',title:'A face. A thousand details.',name:'The portrait',src:'./media/portrait.jpg',alt:'Outdoor portrait of a smiling woman'},
{type:'Audio',title:'Listen between the lines.',name:'The storyteller'},
{type:'Text',title:'Read it. Feel it. Decide.',name:'Local News Report'}
];
const reading='Several public libraries across Toronto will extend their evening opening hours starting next month, following an increase in demand for quiet study spaces. Under the new schedule, selected branches will remain open until 10 p.m. on weekdays, giving students and working residents more flexibility to access library facilities. The initiative follows community feedback highlighting limited study options during the evening, particularly for students balancing coursework and part-time employment. Library officials said the extended hours will be introduced on a trial basis, with attendance figures and visitor feedback used to evaluate whether the programme should continue.';
let step=0,answers=questions.map(()=>({choice:null,confidence:null,seconds:0})),started=0,entered=0,consented=false,result=null,requestId=null,saving=false,saved=false;
const wave=()=>'<div class="wave" aria-hidden="true">'+Array.from({length:49},(_,i)=>'<i style="--h:'+((Math.sin(i*1.7)*.5+.5)*27+5)+'px"></i>').join('')+'</div>';
function modal(html){document.getElementById('modal-content').innerHTML=html;document.getElementById('modal').showModal()}
function showPrivacy(){if(previewMode){modal('<h2>Preview mode</h2><p>This version is for reviewing the design and quiz flow. Your answers stay in memory on this page. They are not sent to a server or saved in a database. You can download your own answers after completing the quiz.</p><p>Images, audio, and fonts are served with this website. Closing or refreshing this page clears your answers.</p>');return}modal('<h2>Your curiosity. Your choice.</h2><p>This quiz collects your five answers, confidence levels, time spent on each question, total completion time, and a random response ID. No name or email is requested. Responses are stored on the server to explore how people distinguish human and AI content.</p><p>Participation is optional. You can leave before submitting. Only completed submissions are collected. Retaking the quiz creates another response, so please submit only once for the study.</p><p>The hosting service may process technical logs under its own privacy policy. This is an educational experiment, not a scientific test of AI detection ability.</p>')}
function showAbout(){modal('<h2>A small test of perception.</h2><p>AI can create convincing images and text. Can your instincts tell the difference? Explore three images, one audio clip and one short text, and decide who—or what—created each one.</p><p>No specialist knowledge needed. There is no timer or time limit. Take around 3–5 minutes, use headphones if you like, and trust your first impression.</p><p>Our goal is 100+ completed responses. This first edition uses sourced human photographs, a human-read public-domain story, and AI-generated examples. Full sources appear after submission. Visual or linguistic clues are never proof on their own.</p>')}
function landing(){step=0;app.innerHTML=`<section class="hero"><div><div class="eyebrow">AI Detection Quiz</div><h1>Human or AI?</h1><p class="intro">Three images, one audio clip, one short text.<br>Can you tell what’s human-made and what’s AI-generated?</p><button class="primary" id="start">Take the quiz <span class="arrow">→</span></button><div class="hero-info"><span>3~5 minutes</span><span>5 questions</span></div><div class="consent"><label><input type="checkbox" id="consent" ${consented?'checked':''}> ${previewMode?'I understand this is a preview and my answers will not be submitted.':'I agree to contribute my answers anonymously to this experiment.'}</label> <button class="textbtn" onclick="showPrivacy()">How we use your data</button></div><div id="message" role="status"></div></div></section>`;
document.getElementById('consent').onchange=e=>consented=e.target.checked;document.getElementById('start').onclick=()=>{if(!consented){document.getElementById('message').textContent='Please agree to the data collection statement before starting.';document.getElementById('consent').focus();return}stopPreview();started=Date.now();requestId=crypto.randomUUID();step=1;entered=Date.now();renderQuestion();window.scrollTo(0,0)}}
let previewAudio=null;function stopPreview(){if(previewAudio){previewAudio.pause();previewAudio=null}}

function media(q){if(q.type==='Image')return '<div class="media"><img src="'+q.src+'" alt="'+q.alt+'"><button class="expand" onclick="expandImage()">⤢ &nbsp; Take a closer look</button></div>';if(q.type==='Audio')return '<div class="media audio-media"><span class="sound-label">Audio clip · 24 seconds</span>'+wave()+'<h2>Does this sound human?</h2><audio id="quiz-audio" preload="metadata" src="./media/reading.mp3" controlslist="nodownload noplaybackrate noremoteplayback" disableremoteplayback></audio><div class="audio-player" role="group" aria-label="Audio player"><button type="button" class="audio-play" id="audio-play" aria-controls="quiz-audio">Play</button><input class="audio-position" id="audio-position" type="range" min="0" max="24" value="0" step="0.1" aria-label="Audio position" aria-valuetext="0:00 of 0:24"><output class="audio-time" id="audio-time" aria-live="off">0:00 / 0:24</output><label class="audio-volume">Volume <input id="audio-volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Audio volume"></label></div><p class="audio-error hidden" id="audio-error" role="status"></p><details class="transcript"><summary>Read transcript</summary><p>To Sherlock Holmes she is always the woman. I have seldom heard him mention her under any other name. In his eyes she eclipses and predominates the whole of her sex.</p><p class="delivery"><strong>Audio description:</strong> One narrator reads an English prose passage aloud. The text above presents the spoken words, with punctuation marking the sentence breaks.</p></details></div>';return '<div class="media text-media"><div class="quote-mark">“</div><blockquote>'+reading+'</blockquote><p>A MOMENT IN THE CITY</p></div>'}
function setupAudioPlayer(){
 const audio=document.getElementById('quiz-audio'),button=document.getElementById('audio-play'),seek=document.getElementById('audio-position'),time=document.getElementById('audio-time'),volume=document.getElementById('audio-volume'),error=document.getElementById('audio-error');
 const format=value=>{const n=Math.max(0,Math.floor(Number(value)||0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};
 const refresh=()=>{const duration=Number.isFinite(audio.duration)?audio.duration:24;seek.max=duration;seek.value=audio.currentTime||0;const current=format(audio.currentTime),total=format(duration);time.textContent=current+' / '+total;seek.setAttribute('aria-valuetext',current+' of '+total)};
 const sync=()=>{button.textContent=audio.paused?'Play':'Pause';button.setAttribute('aria-label',audio.paused?'Play audio':'Pause audio')};
 button.onclick=async()=>{if(!audio.paused){audio.pause();return}try{error.classList.add('hidden');await audio.play()}catch{error.textContent='Audio could not play. Please try again.';error.classList.remove('hidden')}};
 seek.oninput=()=>{audio.currentTime=Number(seek.value);refresh()};volume.oninput=()=>{audio.volume=Number(volume.value)};
 ['loadedmetadata','durationchange','timeupdate','seeked'].forEach(event=>audio.addEventListener(event,refresh));['play','pause','ended'].forEach(event=>audio.addEventListener(event,sync));audio.addEventListener('error',()=>{error.textContent='Audio could not load. Please check your connection and try again.';error.classList.remove('hidden');button.textContent='Play'});refresh();sync();
}
function expandImage(){const q=questions[step-1];modal('<h2>'+q.name+'</h2><img src="'+q.src+'" alt="'+q.alt+'">')}
function renderQuestion(){const q=questions[step-1],a=answers[step-1];app.innerHTML=`<section class="quiz-wrap"><div class="progress-head"><span>Question ${step} of 5</span><span>${step*20}%</span></div><div class="progress" aria-label="Question ${step} of 5">${questions.map((_,i)=>'<i class="'+(i<step?'done':'')+'"></i>').join('')}</div><div class="quiz-title"><div><span class="type">${q.type.toUpperCase()}</span><h1>Is this ${q.type.toLowerCase()} human-made or AI-generated?</h1></div></div><div class="q-layout">${media(q)}<div class="q-panel"><h2>Human-made or AI-generated?</h2><p>${q.type==='Audio'?'You can replay the clip before choosing.':'Take your time, then choose one answer.'}</p><div class="choices" role="group" aria-label="Who created this content?">${['human','ai'].map((v,i)=>'<button class="choice '+(a.choice===v?'selected':'')+'" data-choice="'+v+'" aria-pressed="'+(a.choice===v)+'">'+(i?'AI-generated':'Human-made')+'</button>').join('')}</div><fieldset class="confidence"><legend>How confident are you?</legend><div class="options">${['Just guessing','Somewhat sure','Very sure'].map((v,i)=>'<button class="'+(a.confidence===i+1?'selected':'')+'" data-confidence="'+(i+1)+'" aria-pressed="'+(a.confidence===i+1)+'">'+v+'</button>').join('')}</div></fieldset><div id="message" role="status"></div></div></div><div class="bottom-q"><button class="back" id="back">← ${step===1?'Back to introduction':'Previous question'}</button><button class="primary" id="next" ${!a.choice||!a.confidence?'disabled':''}>${step===5?'Submit & see results':'Next question'} <span class="arrow">→</span></button></div></section>`;
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{a.choice=b.dataset.choice;updateSelection()});document.querySelectorAll('[data-confidence]').forEach(b=>b.onclick=()=>{a.confidence=Number(b.dataset.confidence);updateSelection()});if(q.type==='Audio')setupAudioPlayer();document.getElementById('next').onclick=next;document.getElementById('back').onclick=()=>{a.seconds+=(Date.now()-entered)/1000;if(step===1){landing()}else{step--;entered=Date.now();renderQuestion()}window.scrollTo(0,0)}}
function updateSelection(){const a=answers[step-1];document.querySelectorAll('[data-choice]').forEach(b=>{const s=b.dataset.choice===a.choice;b.classList.toggle('selected',s);b.setAttribute('aria-pressed',s)});document.querySelectorAll('[data-confidence]').forEach(b=>{const s=Number(b.dataset.confidence)===a.confidence;b.classList.toggle('selected',s);b.setAttribute('aria-pressed',s)});document.getElementById('next').disabled=!a.choice||!a.confidence}
function next(){const a=answers[step-1];if(!a.choice||!a.confidence)return;a.seconds+=(Date.now()-entered)/1000;entered=Date.now();if(step<5){step++;entered=Date.now();renderQuestion();window.scrollTo(0,0)}else submit()}
async function submit(){if(saving)return;if(previewMode){const key=['human','ai','human','human','ai'];result={score:answers.reduce((n,a,i)=>n+Number(a.choice===key[i]),0),review:PREVIEW_REVIEW};step=6;renderResults();window.scrollTo(0,0);return}saving=true;const btn=document.getElementById('next');btn.disabled=true;btn.textContent='Saving your answers…';try{const submission=window.quizSubmissionRequest(config,{id:requestId,consent:true,version:'1.0',answers:answers.map(a=>({...a,seconds:Math.round(a.seconds)})),duration:Math.round((Date.now()-started)/1000)});if(!submission)throw Error('not configured');const response=await fetch(submission.url,submission.options);if(!response.ok)throw Error('save failed');result=await response.json();saved=true;step=6;renderResults();window.scrollTo(0,0)}catch{document.getElementById('message').textContent='Your response has not been saved. Please check your connection and try again.';btn.disabled=false;btn.innerHTML='Retry submission <span>↻</span>'}finally{saving=false}}
function renderResults(){const score=result.score;app.innerHTML=`<section class="result-wrap"><div class="result-hero"><div class="eyebrow"><span class="dot"></span> The reveal</div><div><div class="score">${score}<small>/5</small></div></div><h1>${score===5?'Your instincts are sharp.':score>=3?'You’ve got a good eye.':'Reality can be surprising.'}</h1><p>${score>=3?'You spotted more than you missed.':'Some of these were harder than they looked.'} As AI evolves, our instincts have a little more to learn. Curiosity is the best place to start.</p><div class="save-status">${previewMode?'Preview complete · Your answers have not been submitted.':'✓ Your response has been saved. Thank you for your participation.'}</div><span class="pill">${score*20}% correct · 5 discoveries</span></div><div class="review-heading"><h2>Your answers</h2><span class="tiny">5 questions completed</span></div>${questions.map((q,i)=>{const r=result.review[i],correct=answers[i].choice===r.answer;return '<article class="review-row">'+(q.src?'<img class="thumb" src="'+q.src+'" alt="'+q.alt+'">':'<span class="thumb" aria-hidden="true">'+(q.type==='Audio'?'♫':'“')+'</span>')+'<div><h3>0'+(i+1)+' · '+q.name+' <span style="font-weight:400;color:var(--muted)">/ '+(r.answer==='ai'?'AI-generated':'Human-made')+'</span></h3><p>'+r.explanation+' <a href="'+r.source+'" target="_blank" rel="noopener noreferrer">Source ↗</a></p></div><span class="badge '+(correct?'':'wrong')+'">'+(correct?'✓ Correct':'↗ You chose '+(answers[i].choice==='ai'?'AI':'human'))+'</span></article>'}).join('')}<p class="participation-note">Please share this challenge with your friends and family—it would mean so much to two university students working on their final-year project.</p></section>`}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3000)}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});landing();
</script></body></html>
