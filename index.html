e;overflow:hidden}.media>img{width:100%;height:100%;object-fit:contain}.expand{position:absolute;bottom:10px;right:10px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:7px 10px;font-size:12px}.q-panel{padding:22px 25px 0;text-align:center}.q-panel h2{display:none}.q-panel>p{font-size:13px;color:var(--muted);margin:0 0 17px;line-height:1.6}.choices{display:flex;gap:14px;max-width:460px;margin:0 auto}.choice{width:50%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #bfc0c8;background:white;border-radius:5px;min-height:45px;padding:10px;font-size:15px;color:var(--ink)}.choice .ico{font-size:19px;color:var(--muted)}.choice.selected{border-color:var(--blue);background:#f0f2ff;color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}.choice.selected .ico{color:var(--blue)}.confidence{padding:0;margin:23px auto 0;border:0;max-width:460px;width:100%}.confidence legend{width:100%;text-align:center;font-size:13px;margin-bottom:11px;color:var(--muted)}.options{display:flex;gap:6px}.confidence button{flex:1;background:#f5f5f5;border:1px solid transparent;border-radius:4px;font-size:12px;padding:10px 4px;color:#555862}.confidence button.selected{background:#eef0ff;border-color:var(--blue);color:var(--blue)}.q-panel>.primary{margin:23px auto 0;min-width:200px}.bottom-q{border-top:1px solid var(--line);padding-top:18px;margin-top:23px;display:flex;justify-content:space-between;align-items:center;gap:15px;font-size:12px;color:var(--muted)}.back{border:0;padding:0;background:none;color:var(--muted);font-size:13px}.audio-media{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px}.audio-media .sound-label{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}.audio-media h2{font-size:25px;margin:0}.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:50px}.wave i{width:3px;height:var(--h);border-radius:5px;background:var(--blue)}.audio-m :center;gap:10px;margin-top:29px}.secondary{background:#fff;color:var(--ink);border:1px solid #c3c4cb;border-radius:5px;padding:13px 17px;font-size:13px}.notice{color:var(--muted);text-align:center;font-size:12px;line-height:1.9;margin-top:26px}dialog{max-width:560px;width:calc(100% - 32px);padding:30px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:white}dialog::backdrop{background:#24263055}dialog h2{font-size:24px}dialog p{font-size:15px;line-height:1.8;color:#50535c}dialog img{max-width:100%}.close{float:right;border:0;background:none;font-size:22px;color:var(--muted)}#message{font-size:13px;line-height:1.7;color:#b22b46;margin-top:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#26272d;color:white;border-radius:5px;padding:12px 20px;font-size:14px;z-index:20}.preview-banner{background:#f5f5f5;border-bottom:1px solid var(--line);padding:11px 18px;text-align:center;color:#50535c;font-size:13px}.preview-banner select{margin-left:10px;font:inherit;border:1px solid #ccc;border-radius:4px;background:#fff;padding:4px;color:var(--ink)}@media(max-width:750px){header{height:74px;padding:0 22px}.brand{font-size:17px}.nav a{display:none}.nav button{font-size:12px}.hero{padding:45px 23px 43px}.hero h1{font-size:47px;letter-spacing:-2px}.intro{font-size:16px;max-width:330px}.hero-info{gap:14px;font-size:12px}.rule{margin:0 22px}.section{padding:27px 23px 35px}.section-top{align-items:flex-start;flex-direction:column;margin-bottom:25px;gap:10px}.steps{grid-template-columns:1fr;gap:22px}.footer{margin:0 22px;flex-direction:column;padding:20px 0;line-height:1.6}.links{gap:18px}.quiz-wrap{margin:12px 14px 35px;padding:21px 15px}.quiz-title h1{font-size:23px}.media{height:300px}.q-panel{padding:19px 0 0}.choices{gap:10px}.confidence{margin-top:21px}.bottom-q{font-size:11px}.bottom-q>span{max-width:170px;text-align:right;line-height:1.6}.text-media{padding:24px}.text-media blockquote{font-size:20px}.audio-media{gap: </style></head><body>
<header><a class="brand" href="./" aria-label="Human or AI home"><svg class="logo" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M2 16S7 7 16 7s14 9 14 9-5 9-14 9S2 16 2 16Z" stroke="currentColor" stroke-width="1.7"/><circle cx="16" cy="16" r="4" fill="currentColor"/><path d="m26 3 1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3Z" fill="currentColor"/></svg><strong>Human</strong> or AI<span style="color:var(--blue)">?</span></a><nav class="nav"><button onclick="showAbout()">About the quiz</button></nav></header>
<main id="app"></main>
<footer class="footer"><span>AI Detection Quiz</span><div class="links"><span>Human, Apparently · 2026</span><button class="textbtn" onclick="showPrivacy()">Privacy & data</button></div></footer>
<dialog id="modal"><button class="close" aria-label="Close dialog" onclick="this.closest('dialog').close()">×</button><div id="modal-content"></div></dialog><div id="toast" class="toast hidden" role="status"></div>
<script src="./config.js?v=supabase-1"></script>
<script src="./response-api.js?v=supabase-1"></script>
<script>
const config=window.QUIZ_CONFIG||{};
const previewMode=!window.quizSubmissionRequest(config,{});
const app=document.getElementById('app');
if(previewMode){const banner=document.createElement('div');banner.className='preview-banner';banner.textContent='Design preview · Answers are not submitted or collected.';document.body.insertBefore(banner,document.querySelector('header'));}
const PREVIEW_REVIEW=[
 {answer:'human',explanation:'A sourced photograph from Unsplash. Natural detail can look surprisingly unreal.',source:'https://images.unsplash.com/photo-1472396961693-142e6e269027'},
 {answer:'ai',explanation:'Generated for this quiz with OpenAI image generation. The photographic style is part of the illusion.',source:'https://openai.com/index/introducing-4o-image-generation/'},
 {answer:'human',explanation:'A sourced portrait photograph from Unsplash. Smooth lighting is not evidence of AI on its own.',source:'https://images.unsplash.com/photo-1517841905240-472988babdf9'},
 {answer:'human',explanation:'A human narration of A Scandal in Bohemia by Arthur Conan Doyle, from LibriVox. The excerpt is trimmed from the recording.',source:'https://archive.org/details/adventures_sherlock_holmes_rg_librivox'},
 {answer:'ai',explanation:'Written by ChatGPT for this quiz. Evocative imagery and natural language can be generated, too.',source:'https://openai.com/chatgpt/overview/'}
];
const questions=[
{type:'Image',title:'A moment in the wild.',name:'The woodland scene',src:'./media/forest.jpg',alt:'Two deer standing among green woodland plants'},
{type:'Image',title:'A little afternoon escape.',name:'The corner café',src:'./media/cafe.jpg',alt:'A quiet street café with pale buildings, a striped awning and plants'},
{type:'Image',title:'A face. A thousand details.',name:'The portrait',src:'./media/portrait.jpg',alt:'Outdoor portrait of a smiling woman'},
{type:'Audio',title:'Listen between the lines.',name:'The storyteller'},
{type:'Text',title:'Read it. Feel it. Decide.',name:'A small reflection'}
];
const reading='The city wakes in layers: first the buses, then the coffee machines, then the quiet shuffle of people carrying unfinished dreams. By nine, the streets are full, but for a moment at the crossing, everyone pauses together—as if the day is taking a breath.';
let step=0,answers=questions.map(()=>({choice:null,confidence:null,seconds:0})),started=0,entered=0,consented=false,result=null,requestId=null,saving=false,saved=false;
const wave=()=>'<div class="wave" aria-hidden="true">'+Array.from({length:49},(_,i)=>'<i style="--h:'+((Math.sin(i*1.7)*.5+.5)*27+5)+'px"></i>').join('')+'</div>';
function modal(html){document.getElementById('modal-content').innerHTML=html;document.getElementById('modal').showModal()}
function showPrivacy(){if(previewMode){modal('<h2>Preview mode</h2><p>This version is for reviewing the design and quiz flow. Your answers stay in memory on this page. They are not sent to a server or saved in a database. You can download your own answers after completing the quiz.</p><p>Images, audio, and fonts are served with this website. Closing or refreshing this page clears your answers.</p>');return}modal('<h2>Your curiosity. Your choice.</h2><p>This quiz collects your five answers, confidence levels, time spent on each question, total completion time, and a random response ID. No name or email is requested. Responses are stored on the server to explore how people distinguish human and AI content.</p><p>Participation is optional. You can leave before submitting. Only completed submissions are collected. Retaking the quiz creates another response, so please submit only once for the study.</p><p>The hosting service may process technical logs under its own privacy policy. This is an educational experiment, not a scientific test of AI detection ability.</p>')}
function showAbout(){modal('<h2>A small test of perception.</h2><p>AI can create convincing images and text. Can your instincts tell the difference? Explore three images, one audio clip and one short text, and decide who—or what—created each one.</p><p>No specialist knowledge needed. There is no timer or time limit. Take around 3–5 minutes, use headphones if you like, and trust your first impression.</p><p>Our goal is 100+ completed responses. This first edition uses sourced human photographs, a human-read public-domain story, and AI-generated examples. Full sources appear after submission. Visual or linguistic clues are never proof on their own.</p>')}
function landing(){step=0;app.innerHTML=`<section class="hero"><div><div class="eyebrow"><span class="dot"></span> AI Detection Quiz</div><h1>Human or AI?</h1><p class="intro">Three images, one audio clip, one short text.<br>Can you tell what’s human-made and what’s AI-generated?</p><button class="primary" id="start">Take the quiz <span class="arrow">↗</span></button><div class="hero-info"><span>3–5 minutes</span><span>5 questions</span></div><div class="consent"><label><input type="checkbox" id="consent" ${consented?'checked':''}> ${previewMode?'I understand this is a preview and my answers will not be submitted.':'I agree to contribute my answers anonymously to this experiment.'}</label> <button class="textbtn" onclick="showPrivacy()">How we use your data</button></div><div id="message" role="status"></div></div></section>`;
document.getElementById('consent').onchange=e=>consented=e.target.checked;document.getElementById('start').onclick=()=>{if(!consented){document.getElementById('message').textContent='Please agree to the data collection statement before starting.';document.getElementById('consent').focus();return}stopPreview();started=Date.now();requestId=crypto.randomUUID();step=1;entered=Date.now();renderQuestion();window.scrollTo(0,0)}}
let previewAudio=null;function stopPreview(){if(previewAudio){previewAudio.pause();previewAudio=null}}
function togglePreview(){let btn=document.getElementById('preview-audio');if(previewAudio&&!previewAudio.paused){previewAudio.pause();btn.textContent='▶';return}if(!previewAudio){previewAudio=new Audio('./media/reading.mp3');previewAudio.onended=()=>btn.textContent='▶';previewAudio.onerror=()=>toast('Audio could not load. Please try again.')}previewAudio.play().then(()=>btn.textContent='Ⅱ').catch(()=>toast('Tap again to play the audio.'))}
function media(q){if(q.type==='Image')return '<div class="media"><img src="'+q.src+'" alt="'+q.alt+'"><button class="expand" onclick="expandImage()">⤢ &nbsp; Take a closer look</button></div>';if(q.type==='Audio')return '<div class="media audio-media"><span class="sound-label">Audio clip · 24 seconds</span>'+wave()+'<h2>Does this sound human?</h2><audio controls preload="metadata" src="./media/reading.mp3" aria-label="Quiz audio excerpt"></audio><details class="transcript"><summary>Read transcript</summary><p>To Sherlock Holmes she is always the woman. I have seldom heard him mention her under any other name. In his eyes she eclipses and predominates the whole of her sex.</p><p class="delivery"><strong>Audio description:</strong> One narrator reads an English prose passage aloud. The text above presents the spoken words, with punctuation marking the sentence breaks.</p></details></div>';return '<div class="media text-media"><div class="quote-mark">“</div><blockquote>'+reading+'</blockquote><p>A MOMENT IN THE CITY</p></div>'}
function expandImage(){const q=questions[step-1];modal('<h2>'+q.name+'</h2><img src="'+q.src+'" alt="'+q.alt+'">')}
function renderQuestion(){const q=questions[step-1],a=answers[step-1];app.innerHTML=`<section class="quiz-wrap"><div class="progress-head"><span>Question ${step} of 5</span><span>${step*20}%</span></div><div class="progress" aria-label="Question ${step} of 5">${questions.map((_,i)=>'<i class="'+(i<step?'done':'')+'"></i>').join('')}</div><div class="quiz-title"><div><span class="type">${q.type.toUpperCase()}</span><h1>Is this ${q.type.toLowerCase()} human-made or AI-generated?</h1></div></div><div class="q-layout">${media(q)}<div class="q-panel"><h2>Human-made or AI-generated?</h2><p>${q.type==='Audio'?'You can replay the clip before choosing.':'Take your time, then choose one answer.'}</p><div class="choices" role="group" aria-label="Who created this content?">${['human','ai'].map((v,i)=>'<button class="choice '+(a.choice===v?'selected':'')+'" data-choice="'+v+'" aria-pressed="'+(a.choice===v)+'"><span class="ico" aria-hidden="true">'+(i?'✧':'☺')+'</span>'+(i?'AI-generated':'Human-made')+'</button>').join('')}</div><fieldset class="confidence"><legend>How confident are you?</legend><div class="options">${['Just guessing','Somewhat sure','Very sure'].map((v,i)=>'<button class="'+(a.confidence===i+1?'selected':'')+'" data-confidence="'+(i+1)+'" aria-pressed="'+(a.confidence===i+1)+'">'+v+'</button>').join('')}</div></fieldset><button class="primary" id="next" ${!a.choice||!a.confidence?'disabled':''}>${step===5?'Submit & see results':'Next question'} <span class="arrow">→</span></button><div id="message" role="status"></div></div></div><div class="bottom-q"><button class="back" id="back">← ${step===1?'Back to introduction':'Previous question'}</button><span>Your answers are submitted after question 5.</span></div></section>`;
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{a.choice=b.dataset.choice;updateSelection()});document.querySelectorAll('[data-confidence]').forEach(b=>b.onclick=()=>{a.confidence=Number(b.dataset.confidence);updateSelection()});document.getElementById('next').onclick=next;document.getElementById('back').onclick=()=>{a.seconds+=(Date.now()-entered)/1000;if(step===1){landing()}else{step--;entered=Date.now();renderQuestion()}window.scrollTo(0,0)}}
function updateSelection(){const a=answers[step-1];document.querySelectorAll('[data-choice]').forEach(b=>{const s=b.dataset.choice===a.choice;b.classList.toggle('selected',s);b.setAttribute('aria-pressed',s)});document.querySelectorAll('[data-confidence]').forEach(b=>{const s=Number(b.dataset.confidence)===a.confidence;b.classList.toggle('selected',s);b.setAttribute('aria-pressed',s)});document.getElementById('next').disabled=!a.choice||!a.confidence}
function next(){const a=answers[step-1];if(!a.choice||!a.confidence)return;a.seconds+=(Date.now()-entered)/1000;entered=Date.now();if(step<5){step++;entered=Date.now();renderQuestion();window.scrollTo(0,0)}else submit()}
async function submit(){if(saving)return;if(previewMode){const key=['human','ai','human','human','ai'];result={score:answers.reduce((n,a,i)=>n+Number(a.choice===key[i]),0),review:PREVIEW_REVIEW};step=6;renderResults();window.scrollTo(0,0);return}saving=true;const btn=document.getElementById('next');btn.disabled=true;btn.textContent='Saving your answers…';try{const submission=window.quizSubmissionRequest(config,{id:requestId,consent:true,version:'1.0',answers:answers.map(a=>({...a,seconds:Math.round(a.seconds)})),duration:Math.round((Date.now()-started)/1000)});if(!submission)throw Error('not configured');const response=await fetch(submission.url,submission.options);if(!response.ok)throw Error('save failed');result=await response.json();saved=true;step=6;renderResults();window.scrollTo(0,0)}catch{document.getElementById('message').textContent='Your response has not been saved. Please check your connection and try again.';btn.disabled=false;btn.innerHTML='Retry submission <span>↻</span>'}finally{saving=false}}
function renderResults(){const score=result.score;app.innerHTML=`<section class="result-wrap"><div class="result-hero"><div class="eyebrow"><span class="dot"></span> The reveal</div><div><div class="score">${score}<small>/5</small></div></div><h1>${score===5?'Your instincts are sharp.':score>=3?'You’ve got a good eye.':'Reality can be surprising.'}</h1><p>${score>=3?'You spotted more than you missed.':'Some of these were harder than they looked.'} As AI evolves, our instincts have a little more to learn. Curiosity is the best place to start.</p><div class="save-status">${previewMode?'Preview complete · Your answers have not been submitted.':'✓ Your response has been saved. Thank you for taking part.'}</div><span class="pill">${score*20}% correct · 5 discoveries</span></div><div class="review-heading"><h2>Your answers</h2><span class="tiny">5 questions completed</span></div>${questions.map((q,i)=>{const r=result.review[i],correct=answers[i].choice===r.answer;return '<article class="review-row">'+(q.src?'<img class="thumb" src="'+q.src+'" alt="'+q.alt+'">':'<span class="thumb" aria-hidden="true">'+(q.type==='Audio'?'♫':'“')+'</span>')+'<div><h3>0'+(i+1)+' · '+q.name+' <span style="font-weight:400;color:var(--muted)">/ '+(r.answer==='ai'?'AI-generated':'Human-made')+'</span></h3><p>'+r.explanation+' <a href="'+r.source+'" target="_blank" rel="noopener noreferrer">Source ↗</a></p></div><span class="badge '+(correct?'':'wrong')+'">'+(correct?'✓ Correct':'↗ You chose '+(answers[i].choice==='ai'?'AI':'human'))+'</span></article>'}).join('')}<div class="result-actions"><button class="primary" id="share">Share the challenge <span class="arrow">↗</span></button><button class="secondary" id="download">Download my response ↓</button></div><div class="notice">A five-item quiz measures this set of choices, not your overall ability to detect AI.<br>Sources establish these examples’ origins; appearances alone don’t prove authorship.<br>${previewMode?'This preview is not open for study responses.':'Help us reach 100+ responses by sharing the challenge with someone curious.'}</div></section>`;document.getElementById('share').onclick=share;document.getElementById('download').onclick=download}
async function share(){const url=new URL(".",location.href).href;try{if(navigator.share){await navigator.share({title:'Human or AI?',text:'I scored '+result.score+'/5. Can you trust your instincts?',url})}else if(navigator.clipboard){await navigator.clipboard.writeText(url);toast('Challenge link copied!')}else{modal('<h2>Share the challenge</h2><p>Copy this link:</p><input style="width:100%" readonly value="'+url+'">')}}catch(e){if(e.name!=='AbortError')toast('Could not share. Copy this page’s address instead.')}}
function download(){const rows=[['response_id','question','type','answer','confidence','seconds','correct_answer'],...answers.map((a,i)=>[requestId,i+1,questions[i].type,a.choice,a.confidence,Math.round(a.seconds),result.review[i].answer])];const blob=new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='my-ai-quiz-response.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3000)}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});landing();
</script></body></html>
